<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;800&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:576px;overflow:hidden;font-family:"Noto Sans Devanagari","Inter",sans-serif;color:#fff;
 background:radial-gradient(1200px 700px at 85% 110%,#4aa35a 0%,#1f5c2e 45%,#143f1f 100%)}
.field{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 100%)}
.leaf{position:absolute;right:-60px;top:-80px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06)}
.leaf2{position:absolute;right:120px;top:60px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.05)}
.wrap{position:relative;z-index:2;padding:46px 56px;height:100%}
.badge{display:inline-flex;align-items:center;gap:10px;background:#f5c518;color:#1d241f;font-weight:800;font-size:20px;padding:8px 18px;border-radius:30px}
.badge svg{width:26px;height:26px}
h1{font-size:92px;line-height:1.05;font-weight:800;margin-top:18px;letter-spacing:-1px;text-shadow:0 4px 18px rgba(0,0,0,.3)}
h2{font-family:"Inter",sans-serif;font-size:30px;font-weight:800;letter-spacing:4px;margin-top:6px;opacity:.95}
.tag{font-size:30px;font-weight:600;margin-top:16px;opacity:.95}
.animals{position:absolute;left:56px;top:345px;font-size:84px;letter-spacing:14px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.bottom{position:absolute;left:56px;right:56px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end}
.addr{font-size:24px;font-weight:600;opacity:.95;line-height:1.35}
.addr small{display:block;font-family:"Inter",sans-serif;font-size:18px;font-weight:600;opacity:.85;letter-spacing:1px}
.phone{background:#fff;color:#1f5c2e;font-family:"Inter",sans-serif;font-weight:800;font-size:32px;padding:14px 26px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
</style></head><body>
<div class="leaf"></div><div class="leaf2"></div><div class="field"></div>
<div class="wrap">
  <span class="badge"><svg viewBox="0 0 48 48"><path d="M24 3l18 6v13c0 11-8 19-18 23C14 41 6 33 6 22V9z" fill="#1f5c2e"/><path d="M21 14h6v7h7v6h-7v7h-6v-7h-7v-6h7z" fill="#fff"/></svg>लाइसेंस प्राप्त · Licensed Veterinary Medicine Agency</span>
  <h1>आर्या मेडिसिन</h1>
  <h2>ARYA MEDICINE</h2>
  <div class="tag">आपके पशुओं का स्वस्थ जीवन, हमारी जिम्मेदारी</div>
  <div class="animals">🐄 🐃 🐐 🐔 🐕</div>
  <div class="bottom">
    <div class="addr">हुसैन चौक, सुपौल, बिहार<small>VACCINES · DEWORMERS · SUPPLEMENTS · INJECTIONS</small></div>
    <div class="phone">📞 94714 66216</div>
  </div>
</div>
</body></html>
